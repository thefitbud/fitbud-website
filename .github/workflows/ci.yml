name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign-up script tests
        run: npm test
      - name: Page and form in Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
