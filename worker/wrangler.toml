# FitBud sign-ups worker: saves early-access sign-ups to D1 and pushes new emails to Loops.
# Setup and deploy steps: worker/README.md. Firoz deploys; never deploy from CI or Claude.
name = "fitbud-signups"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "fitbud-signups"
database_id = "34bd9bcd-842d-49e5-b2a5-0389977415fd"
migrations_dir = "migrations"

[triggers]
# New sign-ups go to Loops straight away; every 10 minutes, retry any Loops did not accept.
crons = ["*/10 * * * *"]

# Logs and traces in the dashboard (Observability tab). Settings match what Cloudflare suggested.
# The worker never logs request bodies, so names and emails don't end up in the logs.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

[vars]
# Pages that may post the form (comma separated).
ALLOWED_ORIGINS = "https://www.thefitbud.com,https://thefitbud.com,https://fitbud-landing.pages.dev,https://fitbud-website.restless-unit-1f42.workers.dev"
# The event Loops listens for to start the follow-up loop.
LOOPS_EVENT_NAME = "early_access_signup"
# Every new sign-up is also sent to this Google Apps Script (sheets/Code.gs), so the team can keep
# working from the sheet. Empty to stop.
SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbxerTZpJu2BpHX-z1IkIpWQk_w0RXLTGYmZ9yBTVbGv5OzdgOdn084ds8NeW2qDGM6HuQ/exec"

# Secret, set with: npx wrangler secret put LOOPS_API_KEY
